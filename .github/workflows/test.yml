name: Server checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node build
      - run: npm run check:engine
      - run: npm run lint -- --max-warnings 0
        if: always() && !cancelled()
      - run: npm run tsc
        if: always() && !cancelled()
      - run: node node_modules/mocha/bin/mocha --timeout 8000 --forbid-only -g ".*"
        if: always() && !cancelled()
      - run: npm run test-npm
        if: always() && !cancelled()
